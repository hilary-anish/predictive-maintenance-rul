# Ingress: routes external HTTP traffic to your Service.
# This is what makes http://localhost:8080 reach your API.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rul-api
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rul-api
                port:
                  number: 80
