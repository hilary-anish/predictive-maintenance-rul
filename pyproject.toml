[project]
name = "predictive-maintenance-rul"
version = "0.1.0"
description = "End-to-end predictive maintenance system for turbofan RUL estimation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "torch>=2.2",
    "mapie>=0.8",
    "mlflow>=2.14",
    "evidently>=0.4.30",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandera>=0.20",
    "matplotlib>=3.8",
    "pyarrow>=16.0",
    "joblib>=1.4",
    "plotly>=5.22",
    "requests>=2.31",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = "-q --tb=short"
testpaths = ["tests"]
