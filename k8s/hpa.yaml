# HPA: auto-scales pods based on CPU usage.
# Why? If traffic spikes, one pod can't handle it all.
# HPA adds more pods when CPU > 70%, removes them when load drops.
# This is what "auto-scaling" means in production.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rul-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rul-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # scale up when CPU > 70%
